name: Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
      - name: Verify static site boundary
        shell: bash
        run: |
          test -f frontend/index.html
          test ! -e frontend/.env
          test ! -e frontend/scan-private.pem
          if find frontend -type f \( -name '*.log' -o -name '*.env' \) -print -quit | grep -q .; then
            echo 'forbidden static secret/log file found' >&2
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
