name: Probe runner egress

# 临时诊断：只回答「GitHub Actions 出口能不能抓到某个订阅主机」。
# 只打印状态码/字节数/响应头判据，从不打印目标地址或响应内容。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe target from runner egress
        env:
          TARGET_URL: ${{ secrets.PROBE_TARGET_URL }}
        shell: bash
        run: |
          set -u
          if [ -z "$TARGET_URL" ]; then echo "missing PROBE_TARGET_URL"; exit 1; fi
          echo "target_host: $(printf '%s' "$TARGET_URL" | sed -E 's#^https?://([^/]+).*#\1#')"
          for ua in clash.meta browser-ua none; do
            case "$ua" in
              clash.meta) agent="clash.meta" ;;
              browser-ua) agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36" ;;
              none) agent="" ;;
            esac
            if [ -n "$agent" ]; then
              out=$(curl -sS -o /tmp/body.txt -D /tmp/head.txt -w '%{http_code} %{size_download} %{time_total}' -A "$agent" "$TARGET_URL" || echo "curl_failed")
            else
              out=$(curl -sS -o /tmp/body.txt -D /tmp/head.txt -w '%{http_code} %{size_download} %{time_total}' -A "" "$TARGET_URL" || echo "curl_failed")
            fi
            mitigated=$( { grep -i '^cf-mitigated:' /tmp/head.txt || true; } | tr -d '\r' | awk '{print $2}')
            server=$( { grep -i '^server:' /tmp/head.txt || true; } | tr -d '\r' | awk '{print $2}')
            acao=$( { grep -i '^access-control-allow-origin:' /tmp/head.txt || true; } | tr -d '\r' | awk '{print $2}')
            head1=$(head -c 60 /tmp/body.txt | tr -d '\r\n' | tr -c '[:print:]' '.')
            echo "profile=$ua result=[$out] cf_mitigated=${mitigated:-none} server=${server:-none} acao=${acao:-none} body_head=${head1}"
          done
          echo "next hop: direct-relay comparison done"
