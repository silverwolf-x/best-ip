name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-python: true
          python-version: "3.13"
      - name: Install Python
        run: uv python install 3.13
      - name: Sync dependencies
        run: uv sync --frozen --dev
      - name: Lint
        run: uv run ruff check .
      - name: Install Node dependencies
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      # npm run check = 语法（scripts/check_js.mjs）+ 前端契约（scripts/check_frontend_contracts.mjs）
      # + MHTML 序列化往返（frontend-next/tools/mhtml-roundtrip.mjs）。新断言接在 check 里，
      # 所以只要这条在跑，CI 就自动覆盖它们，不必在这里逐条罗列。
      - name: Check JavaScript syntax, frontend contracts and mhtml roundtrip
        run: npm run check
      - name: Wrangler dry-run
        run: npm run dry-run
