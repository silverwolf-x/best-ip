name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.13
      - name: Sync dependencies
        run: uv sync --frozen --dev
      - name: Lint
        run: uv run ruff check .
      - name: Test Python
        run: uv run pytest
      - name: Check JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/action-client.js
          node --check frontend/zip-reader.js
          node --check scripts/decrypt_subscription.mjs
      - name: Test browser security and application modules
        run: node --test tests/frontend_modules.test.mjs tests/frontend_app.test.mjs
