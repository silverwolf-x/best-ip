name: Probe IPure schema

# 临时诊断（跑完即删）：用户授权在 runner 上实查 IPure，校准解析器。只读公开接口，不碰任何 secret。
on:
  push:
    branches: [claude/great-hamilton-lcp5sv]
    paths: [.github/workflows/probe-ipure.yml, scripts/probe_ipure.py]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.13"
      - run: uv sync --frozen --no-dev
      - run: uv run --no-dev python scripts/probe_ipure.py
