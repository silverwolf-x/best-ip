name: Scan subscription

run-name: Best IP scan ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Browser-generated correlation ID
        required: true
        type: string
      key_id:
        description: Public encryption key fingerprint
        required: true
        type: string
      encrypted_subscription_url:
        description: AES-GCM URL envelope; never send plaintext here
        required: true
        type: string

concurrency:
  group: best-ip-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate dispatch envelope
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          KEY_ID: ${{ inputs.key_id }}
          EXPECTED_KEY_ID: ${{ vars.SCAN_KEY_ID }}
          ENVELOPE: ${{ inputs.encrypted_subscription_url }}
        shell: bash
        run: |
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{1,128}$ ]]
          [[ "$KEY_ID" =~ ^[A-Za-z0-9:_-]{8,256}$ ]]
          [[ -n "$ENVELOPE" && ${#ENVELOPE} -le 65535 ]]
          [[ -n "$EXPECTED_KEY_ID" && "$KEY_ID" == "$EXPECTED_KEY_ID" ]]

      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-python: true
          python-version: "3.13"

      - name: Install Python
        run: uv python install 3.13

      - name: Sync locked dependencies
        run: uv sync --frozen --no-dev

      - name: Materialize IPure request configuration
        env:
          IPURE_CONFIG_YAML: ${{ secrets.IPURE_CONFIG_YAML }}
        shell: bash
        run: |
          test -n "$IPURE_CONFIG_YAML"
          mkdir -p config
          umask 077
          printf '%s\n' "$IPURE_CONFIG_YAML" > config/ipure.yml
          uv run --no-sync python -c 'from backend.app.sources.ipure_config import load_ipure_headers; headers = load_ipure_headers(); assert headers.get("cookie"), "IPure verification cookie is required"'

      - name: Restore pinned Mihomo archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/best-ip-mihomo
          key: mihomo-${{ runner.os }}-v1.19.30-cf06ce2c7d1421bdbda14ee4a5b6046672dc35ebf8eecd8e77504ec3c0ed9a84

      - name: Download pinned Mihomo
        run: >-
          uv run --no-sync python scripts/download_mihomo.py
          --tag v1.19.30
          --archive-sha256 cf06ce2c7d1421bdbda14ee4a5b6046672dc35ebf8eecd8e77504ec3c0ed9a84
          --archive-cache-dir "${RUNNER_TOOL_CACHE}/best-ip-mihomo"

      - name: Materialize private key in runner temp
        env:
          SCAN_PRIVATE_KEY_PEM: ${{ secrets.SCAN_PRIVATE_KEY_PEM }}
        shell: bash
        run: |
          test -n "$SCAN_PRIVATE_KEY_PEM"
          key_path="$RUNNER_TEMP/scan-private.pem"
          printf '%s\n' "$SCAN_PRIVATE_KEY_PEM" > "$key_path"
          chmod 600 "$key_path"
          printf 'SCAN_PRIVATE_KEY_PATH=%s\n' "$key_path" >> "$GITHUB_ENV"

      - name: Decrypt subscription URL to runner temp
        env:
          BEST_IP_ENVELOPE: ${{ inputs.encrypted_subscription_url }}
          REQUEST_ID: ${{ inputs.request_id }}
          KEY_ID: ${{ inputs.key_id }}
        shell: bash
        run: >-
          node scripts/decrypt_subscription.mjs
          --private-key "$SCAN_PRIVATE_KEY_PATH"
          --output "$RUNNER_TEMP/subscription-url"
          --request-id "$REQUEST_ID"
          --key-id "$KEY_ID"

      - name: Diagnose subscription reachability
        shell: bash
        run: |
          set +e
          url="$(cat "$RUNNER_TEMP/subscription-url")"
          host="$(printf '%s' "$url" | sed -E 's#^[a-z]+://([^/:]+).*#\1#')"
          printf 'diag host_labels=%s host_len=%s\n' "$(awk -F. '{print NF}' <<<"$host")" "${#host}"
          printf 'diag resolv=%s\n' "$(awk '/^nameserver/{printf "%s ",$2}' /etc/resolv.conf)"
          printf 'diag getent=%s\n' "$(getent ahostsv4 "$host" | awk '{print $1}' | sort -u | tr '\n' ',')"
          probe() {
            label="$1"; shift
            out="$(curl -s -o /dev/null -m 25 -w 'http=%{http_code} redirects=%{num_redirects} bytes=%{size_download} time=%{time_total} ip=%{remote_ip}' "$@")"
            printf 'diag %s rc=%s %s\n' "$label" "$?" "$out"
          }
          probe control-egress -A 'clash.meta' 'https://example.com/'
          probe prod-ua -A 'clash.meta' "$url"
          probe browser-ua -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36' "$url"
          probe no-ua -A '' "$url"
          uv run --no-sync python - <<'PY'
          import asyncio, os, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from backend.app.config import settings
          from backend.app.subscription import download_subscription, subscription_failure_reason

          url = Path(os.environ["RUNNER_TEMP"], "subscription-url").read_text(encoding="utf-8").strip()

          async def main() -> None:
              try:
                  content = await download_subscription(
                      url,
                      max_bytes=settings.subscription_max_bytes,
                      timeout_seconds=settings.subscription_timeout_seconds,
                  )
              except Exception as exc:
                  print(f"diag app-fetch rc=1 reason={subscription_failure_reason(exc)} type={type(exc).__name__}")
                  return
              print(f"diag app-fetch rc=0 bytes={len(content)} printable_ascii={content[:1].isascii()}")

          asyncio.run(main())
          PY
      - name: Run production scan
        env:
          BEST_IP_MIHOMO_PATH: ${{ github.workspace }}/runtime/mihomo/mihomo
          REQUEST_ID: ${{ inputs.request_id }}
        shell: bash
        run: >-
          uv run --no-sync python scripts/run_scan.py
          --request-id "$REQUEST_ID"
          --subscription-file "$RUNNER_TEMP/subscription-url"
          --output-dir "$RUNNER_TEMP/action-artifact"

      - name: Upload sanitized result artifact
        uses: actions/upload-artifact@v4
        with:
          name: best-ip-result-${{ inputs.request_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/action-artifact
          if-no-files-found: error
          retention-days: 1

      - name: Remove runner secrets and workspaces
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/scan-private.pem" "$RUNNER_TEMP/subscription-url" config/ipure.yml
          rm -rf runtime/mihomo
