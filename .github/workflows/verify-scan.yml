name: Verify scan flow

# 扫描通路的端到端实测（人工派发）：在 runner 上用 SITE_PASSWORD 登录线上站点，经 Worker 发起一次真实扫描，
# 用前端同一份 scan.js / gateway.js / reader 跟进度、取产物、逐字节校验，并打印聚合耗时与计数。
# 订阅明文不进这里：输入是发起方事先用 frontend-next/app/scan-crypto.js 封好的信封（15 分钟内有效），
# 与浏览器 POST /api/scans 的形状一致。日志只有聚合数字，不含节点名、出口 IP 或订阅内容。
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Envelope request ID
        required: true
        type: string
      key_id:
        description: Public encryption key fingerprint
        required: true
        type: string
      encrypted_subscription_url:
        description: AES-GCM URL envelope; never send plaintext here
        required: true
        type: string

concurrency:
  group: verify-scan-flow
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    # 扫描本身 30 分钟封顶（scan.yml），页面侧最长等 31 分钟；这里再留一点取产物的余量。
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Scan through the live site
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          REQUEST_ID: ${{ inputs.request_id }}
          KEY_ID: ${{ inputs.key_id }}
          ENVELOPE: ${{ inputs.encrypted_subscription_url }}
        shell: bash
        run: |
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{1,128}$ ]]
          [[ "$KEY_ID" =~ ^[a-f0-9]{64}$ ]]
          export BEST_IP_DISPATCH="$(jq -cn --arg r "$REQUEST_ID" --arg k "$KEY_ID" --arg e "$ENVELOPE" '{request_id:$r,key_id:$k,encrypted_subscription_url:$e}')"
          node scripts/verify_scan_flow.mjs --site https://best-ip.silverwolfx.workers.dev
