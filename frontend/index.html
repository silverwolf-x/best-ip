<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="通过工作区 Mihomo 逐节点采集 Coffee IP 页面结构化结果">
  <meta name="api-base" content="">
  <title>Best IP · Coffee 节点检测</title>
  <link rel="stylesheet" href="/styles.css?v=20260822-1">
  <script src="/app.js?v=20260822-1" defer></script>
</head>
<body>
  <div class="container">
    <nav class="nav">
      <div class="nav-scroll"><a href="/" class="active" aria-current="page">Coffee IP 节点检测</a></div>
      <div class="nav-tools">
        <div id="scanStatusBadge" class="scan-status-badge" hidden><span class="pulse-dot"></span><span id="scanStatusText">准备中</span><strong id="scanProgressCount">0/0</strong></div>
        <span id="healthStatus" class="health" aria-live="polite">检查后端...</span>
        <button id="themeButton" class="icon-btn" type="button" aria-label="切换主题" title="切换主题">◐</button>
      </div>
    </nav>

    <header class="page-header">
      <div class="ip-section-header"><h1>Coffee IP 评分 · 订阅节点检测</h1></div>
      <p class="desc">所有节点按顺序经工作区 Mihomo 切换，仅采集 Coffee IP 页面及其明确的同源结构化接口；每个节点完成后立即展示已原子暂存的摘要，全部结束后再生成最终 manifest。</p>
    </header>

    <form id="scanForm" class="search-bar">
      <div class="input-wrap">
        <input id="subscriptionUrl" name="subscription_url" type="password" inputmode="url" autocomplete="off" spellcheck="false" placeholder="粘贴 Mihomo YAML 订阅链接 (https://...)" required>
        <button id="revealButton" class="reveal-btn" type="button" aria-label="切换显示">👁️</button>
      </div>
      <button id="startButton" class="btn btn-primary" type="submit">开始检测</button>
      <button id="cancelButton" class="btn btn-cancel" type="button" hidden>停止</button>
    </form>
    <p id="errorMessage" class="error-box" role="alert" hidden></p>

    <section class="toolbar-panel card">
      <div class="stats-ribbon">
        <div class="stat-pill"><span class="stat-lbl">总节点</span><strong id="totalStat">0</strong></div>
        <div class="stat-pill"><span class="stat-lbl">已检测</span><strong id="completedStat">0</strong></div>
        <div class="stat-pill success"><span class="stat-lbl">完整</span><strong id="successStat">0</strong></div>
        <div class="stat-pill warn"><span class="stat-lbl">部分/失败</span><strong id="issueStat">0</strong></div>
      </div>
      <div class="filter-controls">
        <div class="search-box">
          <input id="resultSearch" type="search" placeholder="搜索节点、IP、ASN、国家、ISP、错误原因...">
          <select id="statusFilter" class="status-select">
            <option value="all">全部状态</option>
            <option value="success">完整</option>
            <option value="partial">部分</option>
            <option value="failed">失败</option>
          </select>
        </div>
        <div class="action-btns">
          <button id="exportCsvBtn" class="btn btn-secondary" type="button" disabled>导出 CSV</button>
          <button id="exportJsonBtn" class="btn btn-secondary" type="button" disabled>导出 JSON</button>
        </div>
      </div>
    </section>

    <section class="card table-container">
      <table class="main-table">
        <thead><tr>
          <th scope="col"><button class="sort-btn" data-sort="node">节点名称</button></th>
          <th scope="col"><button class="sort-btn" data-sort="status">状态</button></th>
          <th scope="col"><button class="sort-btn" data-sort="exit_ip">出口 IP</button></th>
          <th scope="col"><button class="sort-btn" data-sort="location">位置 / 运营商</button></th>
          <th scope="col">网络属性 / ASN</th>
          <th scope="col"><button class="sort-btn" data-sort="security_status">安全状态</button></th>
          <th scope="col"><button class="sort-btn" data-sort="score">评分</button></th>
          <th scope="col">Coffee 全球 Ping</th>
          <th scope="col"><button class="sort-btn" data-sort="elapsed_ms">耗时</button></th>
        </tr></thead>
        <tbody id="resultBody"></tbody>
      </table>
      <div id="emptyResults" class="empty-state"><p class="empty-title">等待首个节点结果</p><p class="empty-desc">每个节点完成并原子暂存后会立即显示；全部节点结束后生成最终 manifest，并开放详情与导出。</p></div>
    </section>

    <footer class="footer">Best IP · Coffee IP 页面结构化节点检测</footer>
  </div>

  <dialog id="detailDialog" class="detail-dialog">
    <div class="dialog-header"><div class="dialog-title-group"><h2 id="detailTitle">节点完整结果</h2><span id="detailSubtitle" class="dialog-subtitle"></span></div><div class="dialog-actions"><button id="copyJsonBtn" class="btn btn-secondary" type="button">复制 JSON</button><button id="closeDialog" class="icon-btn" type="button" aria-label="关闭">×</button></div></div>
    <div id="detailContent" class="detail-scroll-pane"></div>
  </dialog>
</body>
</html>
